name: Living World reliability QA v2 (no merge)
on:
  pull_request:
    branches:
      - work/living-world-reliability-20261112
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Run all Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate real checkpoint
        run: python tools/validate_state.py
