# QA-ONLY overlay. DO NOT MERGE into main or the narrative branch.
# The original repository's 422 JS/47 Python suites use CH-000 turn 9 as a
# fixed fixture; this detached changed-byte turn 10 must use direct validators.
name: QA-only changed checkpoint structural verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node snapshot, chapter, history, and exact five-byte roundtrip
        run: node --test tests/qa_changed_turn_direct_connector.test.mjs
      - name: Python canonical checkpoint validator on synthetic changed bytes
        run: python tools/validate_state.py
