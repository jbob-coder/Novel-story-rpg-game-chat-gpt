name: Narrative integrity
on:
  pull_request:
    branches: [main, work/chat-narrative-foundation, work/literal-recovery-contextual-time-20261113]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: JavaScript unit and integration suites
        run: node --test tests/*.test.mjs
      - name: Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify canonical saved checkpoint
        run: python tools/validate_state.py
