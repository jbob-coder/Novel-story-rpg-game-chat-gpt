name: Living World temporal window QA (synthetic only)
on:
  pull_request:
    branches:
      - work/living-world-time-interval-hardening-20261112
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: All Node reliability tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Canonical checkpoint validator
        run: python tools/validate_state.py
